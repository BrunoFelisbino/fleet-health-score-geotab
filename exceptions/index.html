<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Fleet Exception 360</title>
<style>
*{box-sizing:border-box}:root{--bg:#f4f6f9;--card:#fff;--txt:#111417;--mut:#6b7280;--bd:#e3e6ea;--green:#24B374;--green2:#15803d;--black:#08090A;--cream:#F2EBDB;--red:#ef4444;--yellow:#f59e0b;--blue:#0ea5e9;--mono:Consolas,monospace}body{margin:0;background:radial-gradient(circle,#e8eaee 1px,transparent 1px);background-size:22px 22px;color:var(--txt);font-family:'Segoe UI',system-ui,sans-serif;min-height:100vh;padding:18px}.head,.bar,.info,.panel,.kpi{background:var(--card);border:1px solid var(--bd);border-radius:16px;box-shadow:0 12px 28px rgba(15,23,42,.06)}.head{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;margin-bottom:12px}.title{display:flex;align-items:center;gap:12px;font-weight:900;font-size:19px}.ico{width:44px;height:44px;border-radius:12px;background:var(--black);display:grid;place-items:center;color:var(--cream)}.ico svg{width:28px;height:28px}.sub{font-family:var(--mono);font-size:10px;color:var(--mut);font-weight:400}.pill{font-family:var(--mono);font-size:10px;color:#111417;background:#fff;border:1px solid var(--bd);border-radius:99px;padding:5px 12px;min-width:120px;text-align:center}.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:12px;margin-bottom:12px}button,select,input{height:32px;border-radius:9px;border:1px solid var(--bd);background:#fff;color:var(--txt);font-size:11px;padding:0 10px}button{font-weight:800;cursor:pointer}.primary{background:#111417;color:#fff;border:0}.soft{background:#ecfdf3;color:#065f46;border:0}.alert{padding:10px 14px;border-radius:10px;margin-bottom:12px;font-size:12px;background:#ecfdf3;border:1px solid #bbf7d0;color:#065f46}.alert.err{background:#fef2f2;border-color:#fecaca;color:#991b1b}.grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;margin-bottom:12px}.kpi{padding:14px 16px;min-height:96px}.kpi span{display:block;color:var(--mut);font-size:9px;font-weight:900;letter-spacing:.07em;text-transform:uppercase;margin-bottom:8px}.kpi b{font-family:var(--mono);font-size:28px;line-height:1}.kpi small{display:block;color:var(--mut);font-size:11px;margin-top:6px}.cols{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}.panel{padding:16px;margin-bottom:12px}.pt{font-size:11px;font-weight:900;letter-spacing:.06em;text-transform:uppercase;color:#065f46;margin-bottom:10px}table{width:100%;border-collapse:collapse;font-size:11px}th{text-align:left;background:#f0fdf4;color:#065f46;font-size:9px;text-transform:uppercase;letter-spacing:.06em;padding:8px 10px;position:sticky;top:0}td{padding:8px 10px;border-bottom:1px solid #edf0f4;color:var(--mut);vertical-align:middle}tr:hover td{background:#f8fafc}.badge{display:inline-block;border-radius:99px;padding:2px 9px;font-size:10px;font-weight:800;font-family:var(--mono);background:#f3f4f6;color:#111417}.barrow{display:grid;grid-template-columns:1fr 90px 40px;gap:10px;align-items:center;padding:7px 0;border-bottom:1px solid #edf0f4}.barrow:last-child{border-bottom:0}.track{height:12px;background:#e5e7eb;border-radius:20px;overflow:hidden}.fill{height:12px;border-radius:20px;background:var(--green)}.spinner{width:14px;height:14px;display:inline-block;border:2px solid rgba(255,255,255,.45);border-top-color:#fff;border-radius:50%;vertical-align:-2px;margin-right:7px;animation:spin .7s linear infinite}button[disabled]{opacity:.75;cursor:wait}@keyframes spin{to{transform:rotate(360deg)}}.rank{display:flex;align-items:center;gap:8px}.dot{width:9px;height:9px;border-radius:99px;background:var(--green)}.searchrow{display:flex;gap:8px;flex-wrap:wrap}@media print{button,.bar{display:none!important}body{padding:0;background:#fff}.head,.bar,.info,.panel,.kpi{box-shadow:none;border:1px solid #ddd}}@media(max-width:900px){.grid{grid-template-columns:repeat(2,1fr)}.cols{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="app"><div style="padding:30px;color:#6b7280;font-size:13px">Carregando Fleet Exception 360...</div></div>
<script>
(function(){'use strict';
let apiRef=null,devices=[],groups=[],rules=[],drivers=[],events=[],filtered=[],groupDesc={};
const $=id=>document.getElementById(id);
const DAY=86400000;
const call=(api,t,s)=>new Promise((ok,err)=>api.call('Get',{typeName:t,search:s||{}},ok,err));
const esc=v=>String(v??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const pct=(a,b)=>b?Math.round((a/b)*100):0;
const fmtDate=d=>{try{return new Date(d).toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'})}catch(e){return String(d||'')}};
const nowIso=()=>new Date().toISOString();
function active(d,ref){const at=d.activeTo?new Date(d.activeTo):null,af=d.activeFrom?new Date(d.activeFrom):null;const n=new Date();if(at&&at<n)return false;if(af&&af>n)return false;return true}
function fmtNum(n){return Number(n||0).toLocaleString('pt-BR')}
function shell(){
  $('app').innerHTML=`<div class="head"><div class="title"><div class="ico"><svg viewBox="0 0 24 24" fill="none"><path d="M13 2L7 14h4l-2 6 8-14h-4l2-4z" fill="#F2EBDB"/></svg></div><div>Fleet Exception 360<div class="sub">MAAS • EXCEÇÕES/REGRAS DE TELEMETRIA</div></div></div><div class="pill" id="statusBox">Conectando...</div></div><div class="bar"><button class="primary" id="refreshBtn">Atualizar análise</button><button class="soft" id="csvBtn">Exportar CSV</button><button id="clearBtn">Limpar filtros</button><select id="periodFilter"><option value="7">7 dias</option><option value="14">14 dias</option><option value="30" selected>30 dias</option><option value="90">90 dias</option></select><select id="groupFilter"><option value="">Todos os grupos</option></select><select id="ruleFilter"><option value="">Todas as regras</option></select><div class="searchrow"><input id="queryFilter" placeholder="Veículo, placa ou nome..."/></div></div><div class="info"><span>Fonte: <b>ExceptionEvent</b></span><span>Período: <b id="periodLabel">30 dias</b></span><span>Veículos ativos: <b id="countBox">0</b></span><span id="filterInfo"></span></div><div id="alertBox" class="alert" style="display:none"></div><div id="kpisBox" class="grid"></div><div class="cols"><div class="panel"><div class="pt">Top regras</div><div id="rulesBox"></div></div><div class="panel"><div class="pt">Ranking de veículos</div><div id="rankingBox"></div></div></div><div class="panel"><div class="pt">Lista de eventos</div><div id="tableBox" style="max-height:480px;overflow:auto"></div></div>`;
  $('refreshBtn').onclick=()=>load(apiRef);$('csvBtn').onclick=exportCSV;$('clearBtn').onclick=clearFilters;$('periodFilter').onchange=()=>load(apiRef);$('groupFilter').onchange=apply;$('ruleFilter').onchange=apply;$('queryFilter').oninput=apply;
}
function setRefreshLoading(on){const b=$('refreshBtn');if(!b)return;if(on){b.disabled=true;b.innerHTML='<span class="spinner"></span>Atualizando...'}else{b.disabled=false;b.textContent='Atualizar análise'}}
function setStatus(t){const e=$('statusBox');if(e)e.textContent=t}
function alertMsg(t,ok){const e=$('alertBox');if(!e)return;e.style.display=t?'block':'none';e.className='alert '+(ok===false?'err':'');e.innerHTML=t||''}
function collectDesc(id){const out=[],stack=[id],seen={};while(stack.length){const cur=stack.pop();if(seen[cur])continue;seen[cur]=true;out.push(cur);const node=groupById[cur];const kids=(node&&node.children)||[];kids.forEach(c=>{const cid=typeof c==='string'?c:c&&c.id;if(cid)stack.push(cid)})}return out}
let groupById={};
function groupMatch(v,g){if(!g)return true;const ids=groupDesc[g]||[g];return (v.grupos||[]).some(id=>ids.includes(id))}
function durationSeconds(d){if(d==null)return '';const n=Number(d);if(!isNaN(n))return String(Math.round(n/1000));return String(d)}
function eventInstances(e){const c=Number(e.exceptionCount);return isNaN(c)?1:c}
function buildGroupSelect(list){
  groupById={};list.forEach(g=>{if(g&&g.id)groupById[g.id]=g});groupDesc={};Object.keys(groupById).forEach(id=>groupDesc[id]=collectDesc(id));
  $('groupFilter').innerHTML='<option value="">Todos os grupos</option>'+list.filter(g=>g.name&&g.name!=='GroupCompanyId'&&g.name!=='GroupNothingId').sort((a,b)=>a.name.localeCompare(b.name)).map(g=>`<option value="${g.id}">${esc(g.name)}</option>`).join('');
}
function buildRuleSelect(list){
  $('ruleFilter').innerHTML='<option value="">Todas as regras</option>'+list.filter(r=>r.name).sort((a,b)=>a.name.localeCompare(b.name)).map(r=>`<option value="${r.id}">${esc(r.name)}</option>`).join('');
}
function apply(){const g=$('groupFilter').value,r=$('ruleFilter').value,txt=($('queryFilter').value||'').toLowerCase().trim();filtered=events.filter(v=>{
  if(!groupMatch(v,g))return false;if(r&&v.regraId!==r)return false;if(txt&&!((v.veiculo+' '+v.placa).toLowerCase().includes(txt)))return false;return true;
});const parts=[];if(g)parts.push('grupo');if(r)parts.push('regra');if(txt)parts.push('busca');$('filterInfo').innerHTML=parts.length?`<span class="badge">Filtro: ${parts.join(' + ')} • ${filtered.length} eventos</span>`:'';render()}
function clearFilters(){$('groupFilter').value='';$('ruleFilter').value='';$('queryFilter').value='';apply()}
function render(){const total=filtered.length,instances=filtered.reduce((s,v)=>s+eventInstances(v),0),vehicles=new Set(filtered.map(v=>v.veiculoId)).size,rulesCount=new Set(filtered.map(v=>v.regraId)).size,h24=filtered.filter(v=>v.activeFrom&&(Date.now()-new Date(v.activeFrom).getTime())<=DAY).length;$('countBox').textContent=vehicles.toLocaleString('pt-BR');$('kpisBox').innerHTML=[['Eventos de exceção',fmtNum(total),'no período filtrado'],['Instâncias',fmtNum(instances),'exceptionCount quando disponível'],['Veículos',fmtNum(vehicles),'envolvidos no filtro'],['Regras',fmtNum(rulesCount),'regras distintas'],['Últimas 24h',fmtNum(h24),'eventos recentes']].map(c=>`<div class="kpi"><span>${c[0]}</span><b>${c[1]}</b><small>${c[2]}</small></div>`).join('');const ruleAgg={};filtered.forEach(v=>{const k=v.regraId;(ruleAgg[k]||(ruleAgg[k]={id:k,name:v.regra,count:0,instances:0}));ruleAgg[k].count++;ruleAgg[k].instances+=eventInstances(v)});const topRules=Object.values(ruleAgg).sort((a,b)=>b.instances-a.instances).slice(0,10);const maxR=Math.max(1,...topRules.map(r=>r.instances));$('rulesBox').innerHTML=topRules.length?topRules.map(r=>`<div class="barrow"><b style="color:#111417">${esc(r.name)}</b><div class="track"><div class="fill" style="width:${Math.round(r.instances/maxR*100)}%"></div></div><span style="font-family:var(--mono)">${fmtNum(r.instances)}</span></div>`).join(''):'<div style="padding:20px;text-align:center;color:var(--mut)">Sem eventos no filtro.</div>';const rank={};filtered.forEach(v=>{const k=v.veiculoId;(rank[k]||(rank[k]={id:k,veiculo:v.veiculo,placa:v.placa,count:0,instances:0,rules:{}}));rank[k].count++;rank[k].instances+=eventInstances(v);rank[k].rules[v.regraId]=true});const topVehicles=Object.values(rank).sort((a,b)=>b.instances-a.instances).slice(0,10);$('rankingBox').innerHTML=topVehicles.length?'<table><thead><tr><th>#</th><th>Veículo</th><th>Placa</th><th>Eventos</th><th>Inst.</th><th>Regras</th><th>Último</th></tr></thead><tbody>'+topVehicles.map((v,i)=>`<tr><td>${i+1}</td><td><b style="color:#111417">${esc(v.veiculo)}</b></td><td><span style="font-family:var(--mono);font-size:10px">${esc(v.placa||'—')}</span></td><td>${fmtNum(v.count)}</td><td>${fmtNum(v.instances)}</td><td>${Object.keys(v.rules).length}</td><td>${fmtDate(filtered.filter(e=>e.veiculoId===v.id).map(e=>e.activeTo||e.activeFrom).sort().pop())}</td></tr>`).join('')+'</tbody></table>':'<div style="padding:20px;text-align:center;color:var(--mut)">Sem veículos no filtro.</div>';$('tableBox').innerHTML=filtered.length?'<table><thead><tr><th>Data/hora</th><th>Regra</th><th>Veículo</th><th>Placa</th><th>Inst.</th><th>Duração</th><th>Estado</th></tr></thead><tbody>'+[...filtered].sort((a,b)=>new Date(b.activeFrom||0)-new Date(a.activeFrom||0)).slice(0,80).map(v=>`<tr><td>${fmtDate(v.activeFrom)}</td><td><span class="badge">${esc(v.regra)}</span></td><td><b style="color:#111417">${esc(v.veiculo)}</b></td><td><span style="font-family:var(--mono);font-size:10px">${esc(v.placa||'—')}</span></td><td>${fmtNum(eventInstances(v))}</td><td>${durationSeconds(v.duration)}s</td><td>${esc(v.state||'—')}</td></tr>`).join('')+'</tbody></table>':'<div style="padding:25px;text-align:center;color:var(--mut)">Nenhum evento encontrado com os filtros atuais.</div>'}
async function load(api){if(!api){setStatus('Não conectado');alertMsg('Abra dentro do MyGeotab para carregar dados reais.',false);return}apiRef=api;setRefreshLoading(true);$('periodLabel').textContent=$('periodFilter').value+' dias';alertMsg('Consultando Device, Group, Rule, Driver e ExceptionEvent...');const now=new Date(),from=new Date(now.getTime()-Number($('periodFilter').value)*DAY);try{const devs=await call(api,'Device',{fromDate:now.toISOString()}).catch(()=>call(api,'Device',{}));const dm={};devs.forEach(d=>{if(!d.name)return;if(!active(d))return;dm[d.id]={id:d.id,veiculo:d.name,placa:d.licensePlate||d.name,grupos:(d.groups||[]).map(g=>g.id)}});devices=Object.keys(dm).map(k=>dm[k]);const gs=await call(api,'Group',{}).catch(()=>[]);groups=gs;buildGroupSelect(groups);const rs=await call(api,'Rule',{}).catch(()=>[]);rules=rs.filter(r=>r&&r.id);buildRuleSelect(rules);let ds=[];try{ds=await call(api,'Driver',{})}catch(e){}drivers=ds;const ruleMap={};rules.forEach(r=>ruleMap[r.id]=r);const driverMap={};drivers.forEach(d=>{if(d&&d.id)driverMap[d.id]=d});let ev=[];try{ev=await call(api,'ExceptionEvent',{fromDate:from.toISOString(),toDate:now.toISOString(),includeExceptionCount:true})}catch(e){console.warn(e)}events=ev.map(e=>{const id=e.device&&e.device.id;const d=dm[id];if(!d)return null;const rule=e.rule&&e.rule.id?ruleMap[e.rule.id]:null;const dur=e.duration;return{id:e.id,activeFrom:e.activeFrom,activeTo:e.activeTo,deviceId:id,veiculoId:id,veiculo:d.veiculo,placa:d.placa,grupos:d.grupos,regraId:e.rule&&e.rule.id||'sem-regra',regra:rule&&rule.name?rule.name:(e.rule&&e.rule.name)||'Regra desconhecida',driverId:e.driver&&e.driver.id||'',driver:e.driver&&e.driver.id?(driverMap[e.driver.id]&&driverMap[e.driver.id].name)||'':'',duration:dur,state:e.state,exceptionCount:e.exceptionCount,e}}).filter(Boolean);filtered=[...events];setStatus(events.length+' eventos');alertMsg('Análise concluída. Período de '+$('periodFilter').value+' dias carregado.',true);apply()}catch(e){console.error(e);setStatus('Erro');alertMsg('Erro ao carregar: '+(e.message||e),false)}finally{setRefreshLoading(false)}}
function exportCSV(){if(!filtered.length)return;const rows=[['data_inicio','data_fim','veiculo','placa','regra','instancias','duracao','estado','driver']].concat(filtered.map(v=>[v.activeFrom,v.activeTo||'',v.veiculo,v.placa,v.regra,eventInstances(v),durationSeconds(v.duration)+'s',v.state||'',v.driver||'']));const csv=rows.map(r=>r.map(x=>'"'+String(x??'').replace(/"/g,'""')+'"').join(';')).join('\n');const blob=new Blob([csv],{type:'text/csv;charset=utf-8'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='fleet-exception-360.csv';a.click();URL.revokeObjectURL(a.href)}
function init(api){apiRef=api;shell();load(api)}
if(!window.geotab)window.geotab={addin:{}};if(!window.geotab.addin)window.geotab.addin={};window.geotab.addin.fleetException360=function(){return{initialize:function(api,state,cb){try{init(api)}catch(e){console.error(e);const root=$('app');if(root)root.innerHTML='<div style="padding:20px;color:#991b1b">Erro ao iniciar Fleet Exception 360: '+(e.message||e)+'</div>'}if(cb)cb()},focus:function(){},blur:function(){}}};
})();
</script>
</body>
</html>
