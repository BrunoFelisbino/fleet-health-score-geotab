*{box-sizing:border-box}:root{--bg:#f5f8fc;--card:#fff;--card2:#f8fbff;--txt:#172033;--mut:#64748b;--mut2:#94a3b8;--bd:#e5eaf1;--blue:#0ea5e9;--blue2:#0369a1;--green:#10b981;--yellow:#f59e0b;--orange:#f97316;--red:#ef4444;--gray:#64748b;--shadow:0 12px 28px rgba(15,23,42,.06);--mono:Consolas,monospace}body,#app{font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);min-height:100vh;color:var(--txt);padding:16px 20px;background-image:radial-gradient(circle,rgba(15,23,42,.045) 1px,transparent 1px);background-size:24px 24px}.head,.bar,.info,.panel,.kpi{background:var(--card);border:1px solid var(--bd);border-radius:16px;box-shadow:var(--shadow)}.head{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;margin-bottom:12px}.title{display:flex;gap:10px;align-items:center;font-weight:800;font-size:18px}.ico{width:46px;height:46px;border-radius:10px;background:#000;display:grid;place-items:center;overflow:hidden}.ico img{width:100%;height:100%;object-fit:contain;display:block}.sub{font-family:var(--mono);font-size:10px;color:var(--mut);font-weight:400}.pill{font-family:var(--mono);font-size:10px;color:var(--blue2);background:#fff;border:1px solid var(--bd);border-radius:99px;padding:5px 12px}.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:12px;margin-bottom:12px}.info{display:flex;gap:16px;flex-wrap:wrap;padding:9px 14px;margin-bottom:12px;color:var(--mut);font-size:12px}button,select,input{height:32px;border-radius:8px;border:1px solid var(--bd);background:#fff;color:var(--txt);font-size:11px;padding:0 10px}button{font-weight:700;cursor:pointer}.primary{background:linear-gradient(135deg,var(--blue),var(--blue2));color:#fff;border:0}.alert{padding:10px 14px;border-radius:10px;margin-bottom:12px;font-size:12px;background:rgba(14,165,233,.1);border:1px solid rgba(14,165,233,.22);color:var(--blue2)}.alert.ok{background:rgba(16,185,129,.12);border-color:rgba(16,185,129,.22);color:#047857}.alert.err{background:rgba(239,68,68,.11);border-color:rgba(239,68,68,.22);color:#991b1b}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;margin-bottom:12px}.kpi{padding:16px 14px;min-height:116px;position:relative;overflow:hidden}.kpi span{display:block;color:var(--mut2);font-size:9px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;margin-bottom:8px}.kpi b{font-family:var(--mono);font-size:30px;line-height:1}.kpi small{display:block;color:var(--mut);font-size:12px;margin-top:4px}.mini{height:28px;margin-top:8px;display:flex;align-items:end;gap:4px}.mini i{display:block;flex:1;min-width:3px;border-radius:4px 4px 0 0;background:var(--blue);opacity:.85}.cols{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}.cols3{display:grid;grid-template-columns:1fr 1fr .75fr;gap:12px;margin-bottom:12px}.panel{padding:16px 18px;margin-bottom:12px}.pt{font-size:12px;font-weight:800;color:var(--blue2);letter-spacing:.06em;text-transform:uppercase;margin-bottom:12px}.pt:before{content:'';display:inline-block;width:3px;height:12px;background:linear-gradient(var(--blue),var(--blue2));border-radius:2px;margin-right:7px;vertical-align:-2px}table{width:100%;border-collapse:collapse;font-size:11px}th{text-align:left;background:#f0f9ff;color:var(--blue2);font-size:9px;text-transform:uppercase;letter-spacing:.06em;padding:8px 10px}td{padding:8px 10px;border-bottom:1px solid #edf2f7;color:var(--mut);vertical-align:middle}tr:hover td{background:#f8fbff}.badge{display:inline-block;border-radius:99px;padding:2px 9px;font-size:10px;font-weight:800;font-family:var(--mono)}.okb{background:rgba(16,185,129,.12);color:#047857}.warnb{background:rgba(245,158,11,.13);color:#92400e}.orangeb{background:rgba(249,115,22,.12);color:#9a3412}.riskb{background:rgba(239,68,68,.11);color:#991b1b}.map{height:380px;border:1px solid var(--bd);border-radius:16px;overflow:hidden}.detail{display:grid;grid-template-columns:1fr 1fr;gap:10px;font-size:12px}.detail label{display:block;color:var(--mut2);font-size:10px;text-transform:uppercase;margin-bottom:2px}.detail span{font-family:var(--mono);color:var(--txt)}.reason{margin-top:12px;display:grid;gap:7px}.reason div{padding:8px 10px;background:var(--card2);border:1px solid var(--bd);border-radius:9px;color:var(--mut);font-size:12px}.reason div.hot{background:rgba(239,68,68,.08);border-color:rgba(239,68,68,.22);color:#991b1b}.problem{cursor:pointer}.problem.active td{background:#e0f2fe!important}.filterpill{display:inline-flex;align-items:center;gap:6px;background:#e0f2fe;border:1px solid #bae6fd;color:var(--blue2);border-radius:999px;padding:4px 10px;font-size:11px;font-weight:700}.clear{color:var(--red);cursor:pointer;font-weight:800;margin-left:8px}.barrow{display:grid;grid-template-columns:130px 1fr 70px;gap:10px;align-items:center;padding:7px 0;border-bottom:1px solid #edf2f7}.barrow:last-child{border-bottom:0}.track{height:11px;background:#eaf4fb;border-radius:20px;overflow:hidden}.fill{height:11px;border-radius:20px;background:var(--blue)}.donutwrap{display:flex;align-items:center;gap:20px;min-height:170px}.donut{width:132px;height:132px;border-radius:50%;display:grid;place-items:center;position:relative}.donut:after{content:'';width:82px;height:82px;background:#fff;border-radius:50%;position:absolute}.donut div{position:relative;z-index:1;text-align:center}.donut b{font-size:28px;font-family:var(--mono)}.legend{display:grid;gap:9px;font-size:12px;color:var(--mut)}.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:7px;vertical-align:-2px}.diaglist{display:grid;gap:8px;font-size:12px}.diaglist div{display:flex;justify-content:space-between;border-bottom:1px solid #edf2f7;padding-bottom:6px;color:var(--mut)}.diaglist b{color:var(--txt);font-family:var(--mono)}@media(max-width:900px){.cols,.cols3{grid-template-columns:1fr}.donutwrap{flex-direction:column;align-items:flex-start}}@media(max-width:700px){body,#app{padding:10px}.bar{align-items:stretch;flex-direction:column}.grid{grid-template-columns:1fr}}
button[disabled]{opacity:.78;cursor:wait}.spinner{width:14px;height:14px;display:inline-block;border:2px solid rgba(255,255,255,.5);border-top-color:#fff;border-radius:50%;vertical-align:-2px;margin-right:7px;animation:spin .7s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}

<script>(function(){'use strict';
const DAY=86400000;
let apiRef=null,map=null,layer=null,vehicles=[],filtered=[],problemFilter='',groupDesc={},groupById={},loadToken=0,auditFocus=null;
const FILTER_KEY='fleetException360Filters';
const $=id=>document.getElementById(id);
const call=(api,t,s)=>new Promise((ok,err)=>api.call('Get',{typeName:t,search:s||{}},ok,err));
const esc=v=>String(v??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const pct=(a,b)=>b?Math.round((a/b)*100):0;
const nowIso=()=>new Date().toISOString();
const fmtDate=d=>{try{return new Date(d).toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'})}catch(e){return String(d||'')}};
const fmtNum=n=>Number(n||0).toLocaleString('pt-BR');
const activeDevice=d=>{const n=new Date(),at=d.activeTo?new Date(d.activeTo):null,af=d.activeFrom?new Date(d.activeFrom):null;if(at&&at<n)return false;if(af&&af>n)return false;return true};
function parseDurationMs(d){if(d==null||d==="")return 0;const str=String(d);const m=str.match(/^(?:(\d+)\.)?(\d{1,2}):(\d{2}):(\d{2})(?:\.\d+)?$/);if(m){const days=Number(m[1]||0);return(days*86400+Number(m[2]||0)*3600+Number(m[3]||0)*60+Number(m[4]||0))*1000}const n=Number(d);return isNaN(n)?0:n}
function fmtDuration(d){if(d==null||d==='')return '—';const ms=parseDurationMs(d);if(ms<1000)return '—';const s=Math.floor(ms/1000),m=Math.floor(s/60),h=Math.floor(m/60),days=Math.floor(h/24);const parts=[];if(days)parts.push(days+'d');if(h%24)parts.push((h%24)+'h');if(m%60)parts.push((m%60)+'m');if(s%60)parts.push((s%60)+'s');return parts.join(' ')}
function stateLabel(s){const map={ExceptionEventStateValidId:'Válido',ExceptionEventStateInvalidId:'Inválido',ExceptionEventStateAcknowledgedId:'Reconhecido'};return map[s]||String(s||'—').replace(/^ExceptionEventState/i,'').replace(/Id$/i,'')}
function durationSeconds(d){return Math.round(parseDurationMs(d)/1000)}
function eventInstances(e){const raw=e&&e.exceptionCount;if(raw==null||raw==='')return 1;const c=Number(raw);return Number.isFinite(c)&&c>0?c:1}
function pad2(n){return String(n).padStart(2,'0')}
function inputDateValue(d){return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate())+'T'+pad2(d.getHours())+':'+pad2(d.getMinutes())}
function fmtRange(from,to){const f=d=>d.toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'});return f(from)+' até '+f(to)}
function setRangeFromPeriod(){const el=$('periodFilter');if(!el)return;const p=el.value;if(p==='custom')return;const days=Number(p)||1,now=new Date(),from=new Date(now.getTime()-days*DAY);if($('dateFrom'))$('dateFrom').value=inputDateValue(from);if($('dateTo'))$('dateTo').value=inputDateValue(now)}
function currentRange(){const fromEl=$('dateFrom'),toEl=$('dateTo');let from=fromEl&&fromEl.value?new Date(fromEl.value):null,to=toEl&&toEl.value?new Date(toEl.value):null;if(!from||isNaN(from.getTime())){const days=Number($('periodFilter').value)||1;to=to&&!isNaN(to.getTime())?to:new Date();from=new Date(to.getTime()-days*DAY)}if(!to||isNaN(to.getTime()))to=new Date();if(from.getTime()>to.getTime()){const tmp=from;from=to;to=tmp}return{from:from,to:to,label:fmtRange(from,to)}}
function onCustomRange(){const p=$('periodFilter');if(p&&p.value!=='custom'){const opt=[...p.options].find(o=>o.value==='custom');if(opt)p.value='custom'}load(apiRef)}
function saveFilters(){}
function restoreFilters(){}
function collectDesc(id){const out=[],stack=[id],seen={};while(stack.length){const cur=stack.pop();if(seen[cur])continue;seen[cur]=true;out.push(cur);const node=groupById[cur];const kids=(node&&node.children)||[];kids.forEach(c=>{const cid=typeof c==='string'?c:c&&c.id;if(cid)stack.push(cid)})}return out}
function groupMatch(v,g){if(!g)return true;const ids=groupDesc[g]||[g];return (v.grupos||[]).some(id=>ids.includes(id))}
function vehicleMatch(v,k){if(!k)return true;return v.regraId===k}
function shell(){
  $('app').innerHTML=`<div class="head"><div class="title"><div class="ico"><span data-fleet-brand-icon>FHS</span></div><div><strong data-fleet-brand-name>Fleet Exception 360</strong><div class="sub">Regras e exceções • Geotab</div></div></div><div class="pill" id="statusBox">Conectando...</div></div><div class="bar"><button class="primary" id="refreshBtn">Atualizar análise</button><button id="exportBtn">Exportar CSV</button><button id="pdfBtn">Baixar PDF</button><button id="clearBtn">Limpar filtros</button><select id="periodFilter"><option value="1" selected>Hoje (24h)</option><option value="7">7 dias</option><option value="14">14 dias</option><option value="30">30 dias</option><option value="90">90 dias</option><option value="custom">Personalizado</option></select><label class="datefield">De <input type="datetime-local" id="dateFrom"/></label><label class="datefield">Até <input type="datetime-local" id="dateTo"/></label><select id="groupFilter"><option value="">Todos os grupos</option></select><select id="ruleFilter"><option value="">Todas as regras</option></select><input id="ruleQueryFilter" placeholder="Filtrar regra..."/><input id="queryFilter" placeholder="Placa ou nome..."/></div><div class="info"><span>Fonte: <b>ExceptionEvent</b></span><span>Período: <b id="periodLabel">Hoje (24h)</b></span><span>Veículos ativos: <b id="countBox">0</b></span><span id="filterInfo"></span></div><div id="alertBox" class="alert" style="display:none"></div><div id="kpisBox" class="grid" style="display:grid"></div><div class="cols3" style="display:grid"><div class="panel"><div class="pt">Distribuição de eventos</div><div id="distBox"></div></div><div class="panel"><div class="pt">Top regras — clique para filtrar</div><div id="problemsBox"></div></div><div class="panel"><div class="pt">Duração acumulada</div><div id="trendBox"></div></div></div><div class="cols" style="display:grid"><div class="panel"><div class="pt">Mapa de exceções</div><div id="mapBox" class="map"></div></div><div class="panel"><div class="pt">Diagnóstico do veículo selecionado</div><div id="detailBox" style="color:var(--mut);font-size:12px">Selecione um veículo.</div></div></div><div class="panel"><div class="pt">Ranking por instâncias</div><div id="tableBox"></div></div><footer class="project-credit" aria-label="Créditos do projeto"><span>Desenvolvido por</span> <a href="https://github.com/BrunoFelisbino" target="_blank" rel="noopener noreferrer">Bruno Henrique Felisbino Gonçalves</a> <span aria-hidden="true">·</span> <a href="https://github.com/BrunoFelisbino/fleet-health-score-geotab/blob/main/LICENSE" target="_blank" rel="noopener noreferrer">Licença MIT</a> <span aria-hidden="true">·</span> <span>Projeto independente</span></footer>`;
  $('refreshBtn').onclick=()=>load(apiRef);$('exportBtn').onclick=exportCSV;$('pdfBtn').onclick=openPdfModeDialog;$('clearBtn').onclick=clearFilters;$('periodFilter').onchange=()=>{setRangeFromPeriod();load(apiRef)};$('dateFrom').onchange=onCustomRange;$('dateTo').onchange=onCustomRange;$('groupFilter').onchange=apply;$('ruleFilter').onchange=apply;$('ruleQueryFilter').oninput=apply;$('queryFilter').oninput=apply;
  $('tableBox').addEventListener('click',event=>{
    const row=event.target.closest('[data-audit-id]');
    if(row){auditFocus=event.target.closest('button')||row;openAuditVehicle(row.dataset.auditId)}
  });
  $('tableBox').addEventListener('keydown',event=>{
    if((event.key==='Enter'||event.key===' ')&&event.target.matches('tr[data-audit-id]')){
      event.preventDefault();auditFocus=event.target;openAuditVehicle(event.target.dataset.auditId);
    }
  });
}
function setRefreshLoading(on){const b=$('refreshBtn');if(!b)return;if(on){b.disabled=true;b.innerHTML='<span class="spinner"></span>Atualizando...'}else{b.disabled=false;b.textContent='Atualizar análise'}}
function setStatus(t){const e=$('statusBox');if(e)e.textContent=t}
function alertMsg(t,ok,err){const e=$('alertBox');if(!e)return;e.style.display=t?'block':'none';e.className='alert '+(ok?'ok':err?'err':'');e.textContent=t||''}
function buildGroupSelect(list){groupById={};list.forEach(g=>{if(g&&g.id)groupById[g.id]=g});groupDesc={};Object.keys(groupById).forEach(id=>{groupDesc[id]=collectDesc(id)});$('groupFilter').innerHTML='<option value="">Todos os grupos</option>'+list.filter(g=>g.name&&g.name!=='GroupCompanyId'&&g.name!=='GroupNothingId').sort((a,b)=>String(a.name).localeCompare(String(b.name))).map(g=>`<option value="${g.id}">${esc(g.name)}</option>`).join('')}
function buildRuleSelect(list){const active=list.filter(r=>r&&r.id);const audit=window.Exception360Audit;$('ruleFilter').innerHTML='<option value="">Todas as regras</option>'+active.sort((a,b)=>String(a.name||a.id).localeCompare(String(b.name||b.id))).map(r=>`<option value="${esc(r.id)}" title="${esc(r.name||r.id)}">${esc(audit?audit.ruleTranslation(r.name||r.id):r.name||r.id)}</option>`).join('')}
function apply(){saveFilters();const g=$('groupFilter').value,r=$('ruleFilter')?$('ruleFilter').value:'',rq=($('ruleQueryFilter').value||'').toLowerCase().trim(),txt=($('queryFilter').value||'').toLowerCase().trim();filtered=events.filter(v=>{if(!groupMatch(v,g))return false;if(r&&v.regraId!==r)return false;if(rq&&!String(v.regraNome||rulesLabel(v.regraId)).toLowerCase().includes(rq))return false;if(problemFilter&&v.regraId!==problemFilter)return false;if(txt&&!((v.veiculo+' '+v.placa).toLowerCase().includes(txt)))return false;return true});const parts=[];if(g)parts.push('grupo');if(r)parts.push('regra');if(rq)parts.push('regra texto');if(txt)parts.push('busca');if(problemFilter)parts.push(rulesLabel(problemFilter));$('filterInfo').innerHTML=parts.length?`<span class="filterpill">Filtro: ${parts.join(' + ')} • ${filtered.length} eventos <span class="clear" onclick="window._clearProblem()">limpar problema</span></span>`:'';render()}
function clearFilters(){problemFilter='';$('groupFilter').value='';$('ruleFilter').value='';$('ruleQueryFilter').value='';$('queryFilter').value='';$('periodFilter').value='1';setRangeFromPeriod();load(apiRef)}
function rulesLabel(id){const opt=[...$('ruleFilter').options].find(o=>o.value===id);return opt?opt.textContent:id}
window._clearProblem=function(){problemFilter='';apply()}
window._rule=function(k){problemFilter=problemFilter===k?'':k;apply()}
function render(){const total=filtered.length,instances=filtered.reduce((s,v)=>s+eventInstances(v),0),vehiclesCount=new Set(filtered.map(v=>v.veiculoId)).size,rulesCount=new Set(filtered.map(v=>v.regraId)).size,h24=filtered.filter(v=>v.activeFrom&&(Date.now()-new Date(v.activeFrom).getTime())<=DAY).length;$('countBox').textContent=vehiclesCount.toLocaleString('pt-BR');$('kpisBox').innerHTML=[['Eventos de exceção',fmtNum(total),'no período filtrado','var(--blue)'],['Instâncias',fmtNum(instances),'exceptionCount somado','var(--red)'],['Veículos',fmtNum(vehiclesCount),'envolvidos no filtro','var(--green)'],['Regras',fmtNum(rulesCount),'regras distintas','var(--yellow)'],['Últimas 24h',fmtNum(h24),'eventos recentes','var(--orange)']].map(c=>`<div class="kpi"><span>${c[0]}</span><b style="color:${c[3]}">${c[1]}</b><small>${c[2]}</small></div>`).join('');
  const byRule={};filtered.forEach(v=>{const k=v.regraId;(byRule[k]||(byRule[k]={id:k,name:v.regraNome||rulesLabel(k),events:0,instances:0}));byRule[k].events++;byRule[k].instances+=eventInstances(v)})
  const topRules=Object.values(byRule).sort((a,b)=>b.instances-a.instances).slice(0,10)
  const maxR=Math.max(1,...topRules.map(r=>r.instances))
  $('problemsBox').innerHTML=topRules.length?'<table><tbody>'+topRules.map(r=>`<tr class="problem ${problemFilter===r.id?'active':''}" onclick="window._rule('${r.id}')"><td style="width:210px;color:var(--txt);font-weight:800">${esc(r.name)}</td><td><div class="track"><div class="fill" style="width:${Math.round(r.instances/maxR*100)}%"></div></div></td><td style="width:42px;font-family:var(--mono);color:var(--txt)">${fmtNum(r.instances)}</td></tr>`).join('')+'</tbody></table>':'<div style="padding:20px;text-align:center;color:var(--mut)">Sem eventos no filtro.</div>';
  const ruleDist=Object.values(byRule).sort((a,b)=>b.instances-a.instances).slice(0,6)
  const totalInst=byRule&&Object.values(byRule).reduce((s,r)=>s+r.instances,0)
  $('distBox').innerHTML=ruleDist.length?ruleDist.map(r=>`<div class="barrow"><b style="color:var(--txt)">${esc(r.name)}</b><div class="track"><div class="fill" style="width:${Math.round(r.instances/Math.max(1,totalInst)*100)}%"></div></div><span style="font-family:var(--mono);color:var(--txt)">${pct(r.instances,totalInst)}%</span></div>`).join(''):'<div style="padding:20px;text-align:center;color:var(--mut)">Sem eventos no filtro.</div>';
  const buckets=[0,0,0];filtered.forEach(v=>{const d=v.durationMs||0;if(d<10000)buckets[0]++;else if(d<30000)buckets[1]++;else buckets[2]++})
