<!DOCTYPE html>

<head>

<style>
*{box-sizing:border-box}:root{--bg:#f5f8fc;--card:#fff;--card2:#f8fbff;--txt:#172033;--mut:#64748b;--mut2:#94a3b8;--bd:#e5eaf1;--blue:#0ea5e9;--blue2:#0369a1;--green:#10b981;--yellow:#f59e0b;--orange:#f97316;--red:#ef4444;--gray:#64748b;--shadow:0 12px 28px rgba(15,23,42,.06);--mono:Consolas,monospace}body,#app{font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);min-height:100vh;color:var(--txt);padding:16px 20px;background-image:radial-gradient(circle,rgba(15,23,42,.045) 1px,transparent 1px);background-size:24px 24px}.head,.bar,.info,.panel,.kpi{background:var(--card);border:1px solid var(--bd);border-radius:16px;box-shadow:var(--shadow)}.head{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;margin-bottom:12px}.title{display:flex;gap:10px;align-items:center;font-weight:800;font-size:18px}.ico{width:46px;height:46px;border-radius:10px;background:#000;display:grid;place-items:center;overflow:hidden}.ico img{width:100%;height:100%;object-fit:contain;display:block}.sub{font-family:var(--mono);font-size:10px;color:var(--mut);font-weight:400}.pill{font-family:var(--mono);font-size:10px;color:var(--blue2);background:#fff;border:1px solid var(--bd);border-radius:99px;padding:5px 12px}.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:12px;margin-bottom:12px}.info{display:flex;gap:16px;flex-wrap:wrap;padding:9px 14px;margin-bottom:12px;color:var(--mut);font-size:12px}button,select,input{height:32px;border-radius:8px;border:1px solid var(--bd);background:#fff;color:var(--txt);font-size:11px;padding:0 10px}button{font-weight:700;cursor:pointer}.primary{background:linear-gradient(135deg,var(--blue),var(--blue2));color:#fff;border:0}.alert{padding:10px 14px;border-radius:10px;margin-bottom:12px;font-size:12px;background:rgba(14,165,233,.1);border:1px solid rgba(14,165,233,.22);color:var(--blue2)}.alert.ok{background:rgba(16,185,129,.12);border-color:rgba(16,185,129,.22);color:#047857}.alert.err{background:rgba(239,68,68,.11);border-color:rgba(239,68,68,.22);color:#991b1b}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;margin-bottom:12px}.kpi{padding:16px 14px;min-height:116px;position:relative;overflow:hidden}.kpi span{display:block;color:var(--mut2);font-size:9px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;margin-bottom:8px}.kpi b{font-family:var(--mono);font-size:30px;line-height:1}.kpi small{display:block;color:var(--mut);font-size:12px;margin-top:4px}.mini{height:28px;margin-top:8px;display:flex;align-items:end;gap:4px}.mini i{display:block;flex:1;min-width:3px;border-radius:4px 4px 0 0;background:var(--blue);opacity:.85}.cols{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}.cols3{display:grid;grid-template-columns:1fr 1fr .75fr;gap:12px;margin-bottom:12px}.panel{padding:16px 18px;margin-bottom:12px}.pt{font-size:12px;font-weight:800;color:var(--blue2);letter-spacing:.06em;text-transform:uppercase;margin-bottom:12px}.pt:before{content:'';display:inline-block;width:3px;height:12px;background:linear-gradient(var(--blue),var(--blue2));border-radius:2px;margin-right:7px;vertical-align:-2px}table{width:100%;border-collapse:collapse;font-size:11px}th{text-align:left;background:#f0f9ff;color:var(--blue2);font-size:9px;text-transform:uppercase;letter-spacing:.06em;padding:8px 10px}td{padding:8px 10px;border-bottom:1px solid #edf2f7;color:var(--mut);vertical-align:middle}tr:hover td{background:#f8fbff}.badge{display:inline-block;border-radius:99px;padding:2px 9px;font-size:10px;font-weight:800;font-family:var(--mono)}.okb{background:rgba(16,185,129,.12);color:#047857}.warnb{background:rgba(245,158,11,.13);color:#92400e}.orangeb{background:rgba(249,115,22,.12);color:#9a3412}.riskb{background:rgba(239,68,68,.11);color:#991b1b}.map{height:380px;border:1px solid var(--bd);border-radius:16px;overflow:hidden}.detail{display:grid;grid-template-columns:1fr 1fr;gap:10px;font-size:12px}.detail label{display:block;color:var(--mut2);font-size:10px;text-transform:uppercase;margin-bottom:2px}.detail span{font-family:var(--mono);color:var(--txt)}.reason{margin-top:12px;display:grid;gap:7px}.reason div{padding:8px 10px;background:var(--card2);border:1px solid var(--bd);border-radius:9px;color:var(--mut);font-size:12px}.reason div.hot{background:rgba(239,68,68,.08);border-color:rgba(239,68,68,.22);color:#991b1b}.problem{cursor:pointer}.problem.active td{background:#e0f2fe!important}.filterpill{display:inline-flex;align-items:center;gap:6px;background:#e0f2fe;border:1px solid #bae6fd;color:var(--blue2);border-radius:999px;padding:4px 10px;font-size:11px;font-weight:700}.clear{color:var(--red);cursor:pointer;font-weight:800;margin-left:8px}.barrow{display:grid;grid-template-columns:130px 1fr 70px;gap:10px;align-items:center;padding:7px 0;border-bottom:1px solid #edf2f7}.barrow:last-child{border-bottom:0}.track{height:11px;background:#eaf4fb;border-radius:20px;overflow:hidden}.fill{height:11px;border-radius:20px;background:var(--blue)}.donutwrap{display:flex;align-items:center;gap:20px;min-height:170px}.donut{width:132px;height:132px;border-radius:50%;display:grid;place-items:center;position:relative}.donut:after{content:'';width:82px;height:82px;background:#fff;border-radius:50%;position:absolute}.donut div{position:relative;z-index:1;text-align:center}.donut b{font-size:28px;font-family:var(--mono)}.legend{display:grid;gap:9px;font-size:12px;color:var(--mut)}.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:7px;vertical-align:-2px}.diaglist{display:grid;gap:8px;font-size:12px}.diaglist div{display:flex;justify-content:space-between;border-bottom:1px solid #edf2f7;padding-bottom:6px;color:var(--mut)}.diaglist b{color:var(--txt);font-family:var(--mono)}@media(max-width:900px){.cols,.cols3{grid-template-columns:1fr}.donutwrap{flex-direction:column;align-items:flex-start}}@media(max-width:700px){body,#app{padding:10px}.bar{align-items:stretch;flex-direction:column}.grid{grid-template-columns:1fr}}
button[disabled]{opacity:.78;cursor:wait}.spinner{width:14px;height:14px;display:inline-block;border:2px solid rgba(255,255,255,.5);border-top-color:#fff;border-radius:50%;vertical-align:-2px;margin-right:7px;animation:spin .7s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
</style>
<style>.ico{background:#000!important;border-radius:12px;overflow:hidden;width:155px;height:48px;padding:2px 6px}.ico img{width:100%;height:100%;object-fit:contain;display:block}.ico svg{display:none}</style></head>
<body>
<div id="app"><div style="padding:30px;color:#6b7280;font-size:13px">Carregando Fleet Exception 360...</div></div>
<script>
window.addEventListener('error',function(e){var b=document.getElementById('alertBox');if(b)b.innerHTML='Erro: '+(e.message||e.error||e);});
(function(){'use strict';
let apiRef=null,devices=[],groups=[],rules=[],drivers=[],events=[],filtered=[],groupDesc={};
const $=id=>document.getElementById(id);
const DAY=86400000;
const call=(api,t,s)=>new Promise((ok,err)=>api.call('Get',{typeName:t,search:s||{}},ok,err));
const esc=v=>String(v??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const pct=(a,b)=>b?Math.round((a/b)*100):0;
const fmtDate=d=>{try{return new Date(d).toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'})}catch(e){return String(d||'')}};
const nowIso=()=>new Date().toISOString();
function active(d,ref){const at=d.activeTo?new Date(d.activeTo):null,af=d.activeFrom?new Date(d.activeFrom):null;const n=new Date();if(at&&at<n)return false;if(af&&af>n)return false;return true}
function fmtNum(n){return Number(n||0).toLocaleString('pt-BR')}
function shell(){
  $('app').innerHTML=`<div class="head"><div class="title"><div class="ico"><img src="../assets/maas-logo-transparent.png" alt="Maas"></div><div>Fleet Exception 360<div class="sub">MAAS • EXCEÇÕES/REGRAS DE TELEMETRIA</div></div></div><div class="pill" id="statusBox">Conectando...</div></div><div class="bar"><button class="primary" id="refreshBtn">Atualizar análise</button><button class="soft" id="csvBtn">Exportar CSV</button><button id="clearBtn">Limpar filtros</button><select id="periodFilter"><option value="7" selected>7 dias</option><option value="14">14 dias</option><option value="30">30 dias</option><option value="90">90 dias</option></select><select id="groupFilter"><option value="">Todos os grupos</option></select><select id="ruleFilter"><option value="">Todas as regras</option></select><div class="searchrow"><input id="queryFilter" placeholder="Veículo, placa ou nome..."/></div></div><div class="info"><span>Fonte: <b>ExceptionEvent</b></span><span>Período: <b id="periodLabel">7 dias</b></span><span>Veículos ativos: <b id="countBox">0</b></span><span id="filterInfo"></span></div><div id="alertBox" class="alert" style="display:none"></div><div id="kpisBox" class="grid" style="display:grid"></div><div class="cols" style="display:grid"><div class="panel"><div class="pt">Top regras</div><div id="rulesBox"></div></div><div class="panel"><div class="pt">Ranking de veículos</div><div id="rankingBox"></div></div></div><div class="panel"><div class="pt">Lista de eventos</div><div id="tableBox" style="max-height:480px;overflow:auto"></div></div>`;
  $('refreshBtn').onclick=()=>load(apiRef);$('csvBtn').onclick=exportCSV;$('clearBtn').onclick=clearFilters;$('periodFilter').onchange=()=>load(apiRef);$('groupFilter').onchange=apply;$('ruleFilter').onchange=apply;$('queryFilter').oninput=apply;
}
function setRefreshLoading(on){const b=$('refreshBtn');if(!b)return;if(on){b.disabled=true;b.innerHTML='<span class="spinner"></span>Atualizando...'}else{b.disabled=false;b.textContent='Atualizar análise'}}
function setStatus(t){const e=$('statusBox');if(e)e.textContent=t}
function alertMsg(t,ok){const e=$('alertBox');if(!e)return;e.style.display=t?'block':'none';e.className='alert '+(ok===false?'err':'');e.innerHTML=t||''}
function collectDesc(id){const out=[],stack=[id],seen={};while(stack.length){const cur=stack.pop();if(seen[cur])continue;seen[cur]=true;out.push(cur);const node=groupById[cur];const kids=(node&&node.children)||[];kids.forEach(c=>{const cid=typeof c==='string'?c:c&&c.id;if(cid)stack.push(cid)})}return out}
let groupById={};
function groupMatch(v,g){if(!g)return true;const ids=groupDesc[g]||[g];return (v.grupos||[]).some(id=>ids.includes(id))}
function fmtDuration(d){if(d==null||d==='')return '—';const str=String(d);const m=str.match(/^(\d{2}):(\d{2}):(\d{2})(?:\.\d+)?$/);if(m)return m[3]+'s';const n=Number(d);return isNaN(n)?str:Math.round(n/1000)+'s'}
function stateLabel(s){const map={ExceptionEventStateValidId:'Válido',ExceptionEventStateInvalidId:'Inválido',ExceptionEventStateAcknowledgedId:'Reconhecido'};return map[s]||String(s||'—').replace(/^ExceptionEventState/i,'').replace(/Id$/i,'')}
function durationSeconds(d){if(d==null)return '';const n=Number(d);if(!isNaN(n))return String(Math.round(n/1000));const m=String(d).match(/^(\d{2}):(\d{2}):(\d{2})(?:\.(\d+))?$/);if(m){const f=m[4]?('.'+m[4].slice(0,3)):'';return m[3]+f+'s'}return String(d)}
function eventInstances(e){const c=Number(e.exceptionCount);return isNaN(c)?1:c}
function buildGroupSelect(list){
  groupById={};list.forEach(g=>{if(g&&g.id)groupById[g.id]=g});groupDesc={};Object.keys(groupById).forEach(id=>groupDesc[id]=collectDesc(id));
  $('groupFilter').innerHTML='<option value="">Todos os grupos</option>'+list.filter(g=>g.name&&g.name!=='GroupCompanyId'&&g.name!=='GroupNothingId').sort((a,b)=>a.name.localeCompare(b.name)).map(g=>`<option value="${g.id}">${esc(g.name)}</option>`).join('');
}
function buildRuleSelect(list){
  $('ruleFilter').innerHTML='<option value="">Todas as regras</option>'+list.filter(r=>r.name).sort((a,b)=>a.name.localeCompare(b.name)).map(r=>`<option value="${r.id}">${esc(r.name)}</option>`).join('');
}
function apply(){const g=$('groupFilter').value,r=$('ruleFilter').value,txt=($('queryFilter').value||'').toLowerCase().trim();filtered=events.filter(v=>{
  if(!groupMatch(v,g))return false;if(r&&v.regraId!==r)return false;if(txt&&!((v.veiculo+' '+v.placa).toLowerCase().includes(txt)))return false;return true;
});const parts=[];if(g)parts.push('grupo');if(r)parts.push('regra');if(txt)parts.push('busca');$('filterInfo').innerHTML=parts.length?`<span class="badge">Filtro: ${parts.join(' + ')} • ${filtered.length} eventos</span>`:'';render()}
function clearFilters(){$('groupFilter').value='';$('ruleFilter').value='';$('queryFilter').value='';apply()}
function render(){const total=filtered.length,instances=filtered.reduce((s,v)=>s+eventInstances(v),0),vehicles=new Set(filtered.map(v=>v.veiculoId)).size,rulesCount=new Set(filtered.map(v=>v.regraId)).size,h24=filtered.filter(v=>v.activeFrom&&(Date.now()-new Date(v.activeFrom).getTime())<=DAY).length;$('countBox').textContent=vehicles.toLocaleString('pt-BR');$('kpisBox').innerHTML=[['Eventos de exceção',fmtNum(total),'no período filtrado'],['Instâncias',fmtNum(instances),'exceptionCount quando disponível'],['Veículos',fmtNum(vehicles),'envolvidos no filtro'],['Regras',fmtNum(rulesCount),'regras distintas'],['Últimas 24h',fmtNum(h24),'eventos recentes']].map(c=>`<div class="kpi"><span>${c[0]}</span><b>${c[1]}</b><small>${c[2]}</small></div>`).join('');const ruleAgg={};filtered.forEach(v=>{const k=v.regraId;(ruleAgg[k]||(ruleAgg[k]={id:k,name:v.regra,count:0,instances:0}));ruleAgg[k].count++;ruleAgg[k].instances+=eventInstances(v)});const topRules=Object.values(ruleAgg).sort((a,b)=>b.instances-a.instances).slice(0,10);const maxR=Math.max(1,...topRules.map(r=>r.instances));$('rulesBox').innerHTML=topRules.length?topRules.map(r=>`<div class="barrow"><b style="color:#111417">${esc(r.name)}</b><div class="track"><div class="fill" style="width:${Math.round(r.instances/maxR*100)}%"></div></div><span style="font-family:var(--mono)">${fmtNum(r.instances)}</span></div>`).join(''):'<div style="padding:20px;text-align:center;color:var(--mut)">Sem eventos no filtro.</div>';const rank={};filtered.forEach(v=>{const k=v.veiculoId;(rank[k]||(rank[k]={id:k,veiculo:v.veiculo,placa:v.placa,count:0,instances:0,rules:{}}));rank[k].count++;rank[k].instances+=eventInstances(v);rank[k].rules[v.regraId]=true});const topVehicles=Object.values(rank).sort((a,b)=>b.instances-a.instances).slice(0,10);$('rankingBox').innerHTML=topVehicles.length?'<table><thead><tr><th>#</th><th>Veículo</th><th>Placa</th><th>Eventos</th><th>Inst.</th><th>Regras</th><th>Último</th></tr></thead><tbody>'+topVehicles.map((v,i)=>`<tr><td>${i+1}</td><td><b style="color:#111417">${esc(v.veiculo)}</b></td><td><span style="font-family:var(--mono);font-size:10px">${esc(v.placa||'—')}</span></td><td>${fmtNum(v.count)}</td><td>${fmtNum(v.instances)}</td><td>${Object.keys(v.rules).length}</td><td>${fmtDate(filtered.filter(e=>e.veiculoId===v.id).map(e=>e.activeTo||e.activeFrom).sort().pop())}</td></tr>`).join('')+'</tbody></table>':'<div style="padding:20px;text-align:center;color:var(--mut)">Sem veículos no filtro.</div>';$('tableBox').innerHTML=filtered.length?'<table><thead><tr><th>Data/hora</th><th>Regra</th><th>Veículo</th><th>Placa</th><th>Inst.</th><th>Duração</th><th>Estado</th></tr></thead><tbody>'+[...filtered].sort((a,b)=>new Date(b.activeFrom||0)-new Date(a.activeFrom||0)).slice(0,80).map(v=>`<tr><td>${fmtDate(v.activeFrom)}</td><td><span class="badge">${esc(v.regra)}</span></td><td><b style="color:#111417">${esc(v.veiculo)}</b></td><td><span style="font-family:var(--mono);font-size:10px">${esc(v.placa||'—')}</span></td><td>${fmtNum(eventInstances(v))}</td><td>${fmtDuration(v.duration)}</td><td>${esc(v.state||'—')}</td></tr>`).join('')+'</tbody></table>':'<div style="padding:25px;text-align:center;color:var(--mut)">Nenhum evento encontrado com os filtros atuais.</div>'}
async function load(api){if(!api){setStatus('Não conectado');alertMsg('Abra dentro do MyGeotab para carregar dados reais.',false);return}apiRef=api;setRefreshLoading(true);$('periodLabel').textContent=$('periodFilter').value+' dias';alertMsg('Consultando Device, Group, Rule, Driver e ExceptionEvent...');const now=new Date(),from=new Date(now.getTime()-Number($('periodFilter').value)*DAY);try{const devs=await call(api,'Device',{fromDate:now.toISOString()}).catch(()=>call(api,'Device',{}));const dm={};devs.forEach(d=>{if(!d.name)return;if(!active(d))return;dm[d.id]={id:d.id,veiculo:d.name,placa:d.licensePlate||d.name,grupos:(d.groups||[]).map(g=>g.id)}});devices=Object.keys(dm).map(k=>dm[k]);const gs=await call(api,'Group',{}).catch(()=>[]);groups=gs;buildGroupSelect(groups);const rs=await call(api,'Rule',{}).catch(()=>[]);rules=rs.filter(r=>r&&r.id);buildRuleSelect(rules);let ds=[];try{ds=await call(api,'Driver',{})}catch(e){}drivers=ds;const ruleMap={};rules.forEach(r=>ruleMap[r.id]=r);const driverMap={};drivers.forEach(d=>{if(d&&d.id)driverMap[d.id]=d});let ev=[];try{ev=await call(api,'ExceptionEvent',{fromDate:from.toISOString(),toDate:now.toISOString(),includeExceptionCount:true})}catch(e){console.warn(e)}events=ev.map(e=>{const id=e.device&&e.device.id;const d=dm[id];if(!d)return null;const rule=e.rule&&e.rule.id?ruleMap[e.rule.id]:null;const dur=e.duration;return{id:e.id,activeFrom:e.activeFrom,activeTo:e.activeTo,deviceId:id,veiculoId:id,veiculo:d.veiculo,placa:d.placa,grupos:d.grupos,regraId:e.rule&&e.rule.id||'sem-regra',regra:rule&&rule.name?rule.name:(e.rule&&e.rule.name)||'Regra desconhecida',driverId:e.driver&&e.driver.id||'',driver:e.driver&&e.driver.id?(driverMap[e.driver.id]&&driverMap[e.driver.id].name)||'':'',duration:dur,state:e.state,exceptionCount:e.exceptionCount,e}}).filter(Boolean);filtered=[...events];setStatus(events.length+' eventos');alertMsg('Análise concluída. Período de '+$('periodFilter').value+' dias carregado.',true);apply()}catch(e){console.error(e);setStatus('Erro');alertMsg('Erro ao carregar: '+(e.message||e),false)}finally{setRefreshLoading(false)}}
function exportCSV(){if(!filtered.length)return;const rows=[['data_inicio','data_fim','veiculo','placa','regra','instancias','duracao','estado','driver']].concat(filtered.map(v=>[v.activeFrom,v.activeTo||'',v.veiculo,v.placa,v.regra,eventInstances(v),fmtDuration(v.duration),stateLabel(v.state),v.driver||'']));const csv=rows.map(r=>r.map(x=>'"'+String(x??'').replace(/"/g,'""')+'"').join(';')).join('\n');const blob=new Blob([csv],{type:'text/csv;charset=utf-8'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='fleet-exception-360.csv';a.click();URL.revokeObjectURL(a.href)}
function init(api){apiRef=api;shell();load(api)}
if(!window.geotab)window.geotab={addin:{}};if(!window.geotab.addin)window.geotab.addin={};window.geotab.addin.fleetHealthScore=function(){return{initialize:function(api,state,cb){try{init(api)}catch(e){console.error(e);const root=$('app');if(root)root.innerHTML='<div style="padding:20px;color:#991b1b">Erro ao iniciar Fleet Exception 360: '+(e.message||e)+'</div>'}if(cb)cb()},focus:function(){},blur:function(){}}};
})();
</script>
</body>
