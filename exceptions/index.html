*{box-sizing:border-box}:root{--bg:#f5f8fc;--card:#fff;--card2:#f8fbff;--txt:#172033;--mut:#64748b;--mut2:#94a3b8;--bd:#e5eaf1;--blue:#0ea5e9;--blue2:#0369a1;--green:#10b981;--yellow:#f59e0b;--orange:#f97316;--red:#ef4444;--gray:#64748b;--shadow:0 12px 28px rgba(15,23,42,.06);--mono:Consolas,monospace}body,#app{font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);min-height:100vh;color:var(--txt);padding:16px 20px;background-image:radial-gradient(circle,rgba(15,23,42,.045) 1px,transparent 1px);background-size:24px 24px}.head,.bar,.info,.panel,.kpi{background:var(--card);border:1px solid var(--bd);border-radius:16px;box-shadow:var(--shadow)}.head{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;margin-bottom:12px}.title{display:flex;gap:10px;align-items:center;font-weight:800;font-size:18px}.ico{width:46px;height:46px;border-radius:10px;background:#000;display:grid;place-items:center;overflow:hidden}.ico img{width:100%;height:100%;object-fit:contain;display:block}.sub{font-family:var(--mono);font-size:10px;color:var(--mut);font-weight:400}.pill{font-family:var(--mono);font-size:10px;color:var(--blue2);background:#fff;border:1px solid var(--bd);border-radius:99px;padding:5px 12px}.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:12px;margin-bottom:12px}.info{display:flex;gap:16px;flex-wrap:wrap;padding:9px 14px;margin-bottom:12px;color:var(--mut);font-size:12px}button,select,input{height:32px;border-radius:8px;border:1px solid var(--bd);background:#fff;color:var(--txt);font-size:11px;padding:0 10px}button{font-weight:700;cursor:pointer}.primary{background:linear-gradient(135deg,var(--blue),var(--blue2));color:#fff;border:0}.alert{padding:10px 14px;border-radius:10px;margin-bottom:12px;font-size:12px;background:rgba(14,165,233,.1);border:1px solid rgba(14,165,233,.22);color:var(--blue2)}.alert.ok{background:rgba(16,185,129,.12);border-color:rgba(16,185,129,.22);color:#047857}.alert.err{background:rgba(239,68,68,.11);border-color:rgba(239,68,68,.22);color:#991b1b}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;margin-bottom:12px}.kpi{padding:16px 14px;min-height:116px;position:relative;overflow:hidden}.kpi span{display:block;color:var(--mut2);font-size:9px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;margin-bottom:8px}.kpi b{font-family:var(--mono);font-size:30px;line-height:1}.kpi small{display:block;color:var(--mut);font-size:12px;margin-top:4px}.mini{height:28px;margin-top:8px;display:flex;align-items:end;gap:4px}.mini i{display:block;flex:1;min-width:3px;border-radius:4px 4px 0 0;background:var(--blue);opacity:.85}.cols{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}.cols3{display:grid;grid-template-columns:1fr 1fr .75fr;gap:12px;margin-bottom:12px}.panel{padding:16px 18px;margin-bottom:12px}.pt{font-size:12px;font-weight:800;color:var(--blue2);letter-spacing:.06em;text-transform:uppercase;margin-bottom:12px}.pt:before{content:'';display:inline-block;width:3px;height:12px;background:linear-gradient(var(--blue),var(--blue2));border-radius:2px;margin-right:7px;vertical-align:-2px}table{width:100%;border-collapse:collapse;font-size:11px}th{text-align:left;background:#f0f9ff;color:var(--blue2);font-size:9px;text-transform:uppercase;letter-spacing:.06em;padding:8px 10px}td{padding:8px 10px;border-bottom:1px solid #edf2f7;color:var(--mut);vertical-align:middle}tr:hover td{background:#f8fbff}.badge{display:inline-block;border-radius:99px;padding:2px 9px;font-size:10px;font-weight:800;font-family:var(--mono)}.okb{background:rgba(16,185,129,.12);color:#047857}.warnb{background:rgba(245,158,11,.13);color:#92400e}.orangeb{background:rgba(249,115,22,.12);color:#9a3412}.riskb{background:rgba(239,68,68,.11);color:#991b1b}.map{height:380px;border:1px solid var(--bd);border-radius:16px;overflow:hidden}.detail{display:grid;grid-template-columns:1fr 1fr;gap:10px;font-size:12px}.detail label{display:block;color:var(--mut2);font-size:10px;text-transform:uppercase;margin-bottom:2px}.detail span{font-family:var(--mono);color:var(--txt)}.reason{margin-top:12px;display:grid;gap:7px}.reason div{padding:8px 10px;background:var(--card2);border:1px solid var(--bd);border-radius:9px;color:var(--mut);font-size:12px}.reason div.hot{background:rgba(239,68,68,.08);border-color:rgba(239,68,68,.22);color:#991b1b}.problem{cursor:pointer}.problem.active td{background:#e0f2fe!important}.filterpill{display:inline-flex;align-items:center;gap:6px;background:#e0f2fe;border:1px solid #bae6fd;color:var(--blue2);border-radius:999px;padding:4px 10px;font-size:11px;font-weight:700}.clear{color:var(--red);cursor:pointer;font-weight:800;margin-left:8px}.barrow{display:grid;grid-template-columns:130px 1fr 70px;gap:10px;align-items:center;padding:7px 0;border-bottom:1px solid #edf2f7}.barrow:last-child{border-bottom:0}.track{height:11px;background:#eaf4fb;border-radius:20px;overflow:hidden}.fill{height:11px;border-radius:20px;background:var(--blue)}.donutwrap{display:flex;align-items:center;gap:20px;min-height:170px}.donut{width:132px;height:132px;border-radius:50%;display:grid;place-items:center;position:relative}.donut:after{content:'';width:82px;height:82px;background:#fff;border-radius:50%;position:absolute}.donut div{position:relative;z-index:1;text-align:center}.donut b{font-size:28px;font-family:var(--mono)}.legend{display:grid;gap:9px;font-size:12px;color:var(--mut)}.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:7px;vertical-align:-2px}.diaglist{display:grid;gap:8px;font-size:12px}.diaglist div{display:flex;justify-content:space-between;border-bottom:1px solid #edf2f7;padding-bottom:6px;color:var(--mut)}.diaglist b{color:var(--txt);font-family:var(--mono)}@media(max-width:900px){.cols,.cols3{grid-template-columns:1fr}.donutwrap{flex-direction:column;align-items:flex-start}}@media(max-width:700px){body,#app{padding:10px}.bar{align-items:stretch;flex-directi const esc=v=>String(v??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');

const fmtNum=n=>Number(n||0).toLocaleString('pt-BR');
const activeDevice=d=>{const n=new Date(),at=d.activeTo?new Date(d.activeTo):null,af=d.activeFrom?new Date(d.activeFrom):null;if(at&&at<n)return false;if(af&&af>n)return false;return true};
function parseDurationMs(d){if(d==null||d==="")return 0;const str=String(d);const m=str.match(/^(?:(\d+)\.)?(\d{1,2}):(\d{2}):(\d{2})(?:\.\d+)?$/);if(m){const days=Number(m[1]||0);return(days*86400+Number(m[2]||0)*3600+Number(m[3]||0)*60+Number(m[4]||0))*1000}const n=Number(d);return isNaN(n)?0:n}
function fmtDuration(d){if(d==null||d==='')return '—';const ms=parseDurationMs(d);if(ms<1000)return '—';const s=Math.floor(ms/1000),m=Math.floor(s/60),h=Math.floor(m/60),days=Math.floor(h/24);const parts=[];if(days)parts.push(days+'d');if(h%24)parts.push((h%24)+'h');if(m%60)parts.push((m%60)+'m');if(s%60)parts.push((s%60)+'s');return parts.join(' ')}
function stateLabel(s){const map={ExceptionEventStateValidId:'Válido',ExceptionEventStateInvalidId:'Inválido',ExceptionEventStateAcknowledgedId:'Reconhecido'};return map[s]||String(s||'—').replace(/^ExceptionEventState/i,'').replace(/Id$/i,'')}
function durationSeconds(d){return Math.round(parseDurationMs(d)/1000)}
function eventInstances(e){const c=Number(e.exceptionCount);return isNaN(c)?1:c}

function restoreFilters(){let f={};try{f=JSON.parse(localStorage.getItem(FILTER_KEY)||'{}')}catch(e){};if($('groupFilter')){const opt=[...$('groupFilter').options].find(o=>o.value===f.g);$('groupFilter').value=opt?f.g:''}if($('ruleFilter'))$('ruleFilter').value=f.r||'';if($('queryFilter'))$('queryFilter').value=f.txt||'';problemFilter=f.p||''}
function collectDesc(id){const out=[],stack=[id],seen={};while(stack.length){const cur=stack.pop();if(seen[cur])continue;seen[cur]=true;out.push(cur);const node=groupById[cur];const kids=(node&&node.children)||[];kids.forEach(c=>{const cid=typeof c==='string'?c:c&&c.id;if(cid)stack.push(cid)})}return out}
function groupMatch(v,g){if(!g)return true;const ids=groupDesc[g]||[g];return (v.grupos||[]).some(id=>ids.includes(id))}
function vehicleMatch(v,k){if(!k)return true;return v.regraId===k}
