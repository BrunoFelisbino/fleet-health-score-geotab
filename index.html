<style>
*{box-sizing:border-box}:root{--bg:#f5f8fc;--card:#fff;--card2:#f8fbff;--txt:#172033;--mut:#64748b;--mut2:#94a3b8;--bd:#e5eaf1;--blue:#0ea5e9;--blue2:#0369a1;--green:#10b981;--yellow:#f59e0b;--orange:#f97316;--red:#ef4444;--gray:#64748b;--shadow:0 12px 28px rgba(15,23,42,.06);--mono:Consolas,monospace}body,#app{font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);min-height:100vh;color:var(--txt);padding:16px 20px;background-image:radial-gradient(circle,rgba(15,23,42,.045) 1px,transparent 1px);background-size:24px 24px}.head,.bar,.info,.panel,.kpi{background:var(--card);border:1px solid var(--bd);border-radius:16px;box-shadow:var(--shadow)}.head{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;margin-bottom:12px}.title{display:flex;gap:10px;align-items:center;font-weight:800;font-size:18px}.ico{width:46px;height:46px;border-radius:10px;background:#000;display:grid;place-items:center;overflow:hidden}.ico img{width:100%;height:100%;object-fit:contain;display:block}.sub{font-family:var(--mono);font-size:10px;color:var(--mut);font-weight:400}.pill{font-family:var(--mono);font-size:10px;color:var(--blue2);background:#fff;border:1px solid var(--bd);border-radius:99px;padding:5px 12px}.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:12px;margin-bottom:12px}.info{display:flex;gap:16px;flex-wrap:wrap;padding:9px 14px;margin-bottom:12px;color:var(--mut);font-size:12px}button,select,input{height:32px;border-radius:8px;border:1px solid var(--bd);background:#fff;color:var(--txt);font-size:11px;padding:0 10px}button{font-weight:700;cursor:pointer}.primary{background:linear-gradient(135deg,var(--blue),var(--blue2));color:#fff;border:0}.alert{padding:10px 14px;border-radius:10px;margin-bottom:12px;font-size:12px;background:rgba(14,165,233,.1);border:1px solid rgba(14,165,233,.22);color:var(--blue2)}.alert.ok{background:rgba(16,185,129,.12);border-color:rgba(16,185,129,.22);color:#047857}.alert.err{background:rgba(239,68,68,.11);border-color:rgba(239,68,68,.22);color:#991b1b}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;margin-bottom:12px}.kpi{padding:16px 14px;min-height:116px;position:relative;overflow:hidden}.kpi span{display:block;color:var(--mut2);font-size:9px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;margin-bottom:8px}.kpi b{font-family:var(--mono);font-size:30px;line-height:1}.kpi small{display:block;color:var(--mut);font-size:12px;margin-top:4px}.mini{height:28px;margin-top:8px;display:flex;align-items:end;gap:4px}.mini i{display:block;flex:1;min-width:3px;border-radius:4px 4px 0 0;background:var(--blue);opacity:.85}.cols{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}.cols3{display:grid;grid-template-columns:1fr 1fr .75fr;gap:12px;margin-bottom:12px}.panel{padding:16px 18px;margin-bottom:12px}.pt{font-size:12px;font-weight:800;color:var(--blue2);letter-spacing:.06em;text-transform:uppercase;margin-bottom:12px}.pt:before{content:'';display:inline-block;width:3px;height:12px;background:linear-gradient(var(--blue),var(--blue2));border-radius:2px;margin-right:7px;vertical-align:-2px}table{width:100%;border-collapse:collapse;font-size:11px}th{text-align:left;background:#f0f9ff;color:var(--blue2);font-size:9px;text-transform:uppercase;letter-spacing:.06em;padding:8px 10px}td{padding:8px 10px;border-bottom:1px solid #edf2f7;color:var(--mut);vertical-align:middle}tr:hover td{background:#f8fbff}.badge{display:inline-block;border-radius:99px;padding:2px 9px;font-size:10px;font-weight:800;font-family:var(--mono)}.okb{background:rgba(16,185,129,.12);color:#047857}.warnb{background:rgba(245,158,11,.13);color:#92400e}.orangeb{background:rgba(249,115,22,.12);color:#9a3412}.riskb{background:rgba(239,68,68,.11);color:#991b1b}.map{height:380px;border:1px solid var(--bd);border-radius:16px;overflow:hidden}.detail{display:grid;grid-template-columns:1fr 1fr;gap:10px;font-size:12px}.detail label{display:block;color:var(--mut2);font-size:10px;text-transform:uppercase;margin-bottom:2px}.detail span{font-family:var(--mono);color:var(--txt)}.reason{margin-top:12px;display:grid;gap:7px}.reason div{padding:8px 10px;background:var(--card2);border:1px solid var(--bd);border-radius:9px;color:var(--mut);font-size:12px}.reason div.hot{background:rgba(239,68,68,.08);border-color:rgba(239,68,68,.22);color:#991b1b}.problem{cursor:pointer}.problem.active td{background:#e0f2fe!important}.filterpill{display:inline-flex;align-items:center;gap:6px;background:#e0f2fe;border:1px solid #bae6fd;color:var(--blue2);border-radius:999px;padding:4px 10px;font-size:11px;font-weight:700}.clear{color:var(--red);cursor:pointer;font-weight:800;margin-left:8px}.barrow{display:grid;grid-template-columns:130px 1fr 70px;gap:10px;align-items:center;padding:7px 0;border-bottom:1px solid #edf2f7}.barrow:last-child{border-bottom:0}.track{height:11px;background:#eaf4fb;border-radius:20px;overflow:hidden}.fill{height:11px;border-radius:20px;background:var(--blue)}.donutwrap{display:flex;align-items:center;gap:20px;min-height:170px}.donut{width:132px;height:132px;border-radius:50%;display:grid;place-items:center;position:relative}.donut:after{content:'';width:82px;height:82px;background:#fff;border-radius:50%;position:absolute}.donut div{position:relative;z-index:1;text-align:center}.donut b{font-size:28px;font-family:var(--mono)}.legend{display:grid;gap:9px;font-size:12px;color:var(--mut)}.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:7px;vertical-align:-2px}.diaglist{display:grid;gap:8px;font-size:12px}.diaglist div{display:flex;justify-content:space-between;border-bottom:1px solid #edf2f7;padding-bottom:6px;color:var(--mut)}.diaglist b{color:var(--txt);font-family:var(--mono)}@media(max-width:900px){.cols,.cols3{grid-template-columns:1fr}.donutwrap{flex-direction:column;align-items:flex-start}}@media(max-width:700px){body,#app{padding:10px}.bar{align-items:stretch;flex-direction:column}.grid{grid-template-columns:1fr}}
button[disabled]{opacity:.78;cursor:wait}.spinner{width:14px;height:14px;display:inline-block;border:2px solid rgba(255,255,255,.5);border-top-color:#fff;border-radius:50%;vertical-align:-2px;margin-right:7px;animation:spin .7s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
</style>
<script>
(function(){'use strict';
const DAY=86400000;let apiRef=null,map=null,layer=null,vehicles=[],filtered=[],problemFilter='',groupDesc={};
const FILTER_KEY='fleetHealthScoreFilters';
function saveFilters(){try{localStorage.setItem(FILTER_KEY,JSON.stringify({g:$('groupFilter')?$('groupFilter').value:'',s:$('scoreFilter')?$('scoreFilter').value:'',txt:$('queryFilter')?$('queryFilter').value:'',p:problemFilter||''}))}catch(e){}}
function restoreFilters(){let f={};try{f=JSON.parse(localStorage.getItem(FILTER_KEY)||'{}')}catch(e){};if($('groupFilter')){const opt=[...$('groupFilter').options].find(o=>o.value===f.g);$('groupFilter').value=opt?f.g:''}if($('scoreFilter'))$('scoreFilter').value=f.s||'';if($('queryFilter'))$('queryFilter').value=f.txt||'';problemFilter=f.p||''}
const $=id=>document.getElementById(id);
const fmt=v=>v==null||isNaN(Number(v))?'N/I':Number(v).toFixed(2);const fmtDate=d=>{const t=new Date(d);return isNaN(t)?'-':t.toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'})};
const pct=(a,b)=>b?Math.round((a/b)*100):0;
const days=d=>d?Math.floor((Date.now()-new Date(d).getTime())/DAY):999;
const call=(api,t,s)=>new Promise((ok,err)=>api.call('Get',{typeName:t,search:s||{}},ok,err));
function scColor(s){return s>=80?'var(--green)':s>=60?'var(--yellow)':s>=40?'var(--orange)':'var(--red)'}
function scLabel(s){return s>=80?'Saudável':s>=60?'Atenção':s>=40?'Crítico':'Risco alto'}
function scClass(s){return s>=80?'okb':s>=60?'warnb':s>=40?'orangeb':'riskb'}
function has(t,a){t=String(t||'').toLowerCase();return a.some(x=>t.includes(x.toLowerCase()))}
function dname(r){return String(r&&r.diagnostic&&(r.diagnostic.id||r.diagnostic.name)||'')}
function isUnpluggedDiagnostic(r){const n=dname(r).toLowerCase();return n.includes('diagnosticdevicehasbeenunpluggedid')||n.includes('devicehasbeenunplugged')||n.includes('unplugged')||n.includes('desconectado')}
function pName(k){return{unplugged:'Possível remoção não autorizada',voltage:'Tensão fora do padrão',vlow:'Tensão baixa',vhigh:'Tensão alta',reboot:'Reboot excessivo',gps:'Falha GPS',nodata:'Sem comunicação (offline) 7d+',offline:'Sem comunicação (offline)',offline30:'Offline 30d+ (total)',device:'Falha crítica device'}[k]||''}
function groupMatch(v,g){if(!g)return true;const ids=groupDesc[g]||[g];return (v.grupos||[]).some(id=>ids.includes(id))}
function match(v,k){if(!k)return true;if(k==='unplugged')return v.unplugged>0;if(k==='voltage')return(v.vlow+v.vhigh)>0;if(k==='vlow')return v.vlow>0;if(k==='vhigh')return v.vhigh>0;if(k==='reboot')return v.reboots>2;if(k==='gps')return v.gps>0;if(k==='nodata')return v.dias>=7;if(k==='offline')return !!v.offline;if(k==='offline30')return !!v.offline30;if(k==='device')return v.faults>0;return true}
function mainProblem(v){if(v.unplugged>0)return 'Possível remoção não autorizada';if(v.offline)return v.dias>=30?'Offline 30d+ (sem dados na base)':'Sem comunicação '+v.dias+' dias (offline)';if(v.vlow>0)return 'Tensão baixa';if(v.vhigh>0)return 'Tensão alta';if(v.reboots>2)return 'Reboot excessivo';if(v.gps>0)return 'Falha GPS';if(v.faults>0)return 'Falha device';return 'Sem alerta crítico'}

function analyze(records,v){const a={reboots:0,gps:0,vlow:0,vhigh:0,faults:0,unplugged:0,minV:null,maxV:null,badVoltages:[],voltageTotal:0,removalDates:[],reasons:[]};records.forEach(r=>{const n=dname(r),val=Number(r.data);if(isUnpluggedDiagnostic(r)){a.unplugged++;const dt=r&&(r.dateTime||r.date);if(dt){const t=new Date(dt);if(!isNaN(t))a.removalDates.push(t.getTime())}}if(has(n,['reboot','restart']))a.reboots++;if(has(n,['gps invalid','gps failure','no gps','gps']))a.gps++;if(has(n,['device fault','internal device','malfunction']))a.faults++;if(has(n,['external voltage','device voltage','battery voltage','voltage'])&&!isNaN(val)){a.voltageTotal++;a.minV=a.minV==null?val:Math.min(a.minV,val);a.maxV=a.maxV==null?val:Math.max(a.maxV,val);let bad=false;if(val<20){if(val<11){a.vlow++;bad=true}if(val>14.8){a.vhigh++;bad=true}}else{if(val<22){a.vlow++;bad=true}if(val>29){a.vhigh++;bad=true}}if(bad&&a.badVoltages.length<12)a.badVoltages.push(val)}});let p=0,ds=days(v.lastDate);p+=ds<1?30:ds<2?22:ds<4?12:ds<7?5:0;p+=a.reboots===0?20:a.reboots<=2?15:a.reboots<=5?10:a.reboots<=10?5:0;p+=a.gps===0?15:a.gps<=3?11:a.gps<=10?7:0;const vb=a.vlow+a.vhigh;p+=vb===0?20:vb<=5?15:vb<=20?9:0;p+=a.faults===0?15:a.faults<=2?10:a.faults<=6?5:0;if(a.unplugged>0){a.reasons.unshift('Possível remoção não autorizada: diagnóstico DiagnosticDeviceHasBeenUnpluggedId encontrado');p=Math.min(p,25)}if(ds>=30){a.reasons.push('Offline 30d+ — sem dados na base ativa (DeviceStatusInfo)');p=Math.min(p,15)}else if(ds>=7){a.reasons.push('Sem comunicação — sem dados válidos nos últimos 7 dias');p=Math.min(p,45)}else if(ds>=4){a.reasons.push('Comunicação muito atrasada: '+ds+' dias');p=Math.min(p,55)}else if(ds>=2){a.reasons.push('Comunicação ausente há '+ds+' dias')}if(a.reboots>2)a.reasons.push('Reboot excessivo: '+a.reboots);if(a.gps>0)a.reasons.push('Falha GPS: '+a.gps);if(vb>0)a.reasons.push('Tensão fora do padrão: '+vb+' leituras — '+a.badVoltages.map(fmt).join(', ')+' V');if(a.faults>0)a.reasons.push('Falhas críticas do device: '+a.faults);a.score=Math.max(0,Math.round(p));a.dias=ds;a.offline=ds>=7;a.offline30=ds>=30;if(ds>=30)a.score=Math.min(a.score,15);else if(ds>=7)a.score=Math.min(a.score,45);a.removalDates=[...new Set(a.removalDates)].sort((x,y)=>y-x).slice(0,3);a.removalDatesText=a.removalDates.length?a.removalDates.map(fmtDate).join(' | '):'-';a.lastRemovalDate=a.removalDates.length?fmtDate(a.removalDates[0]):'-';return a}
async function load(api){setRefreshLoading(true);if(!api){setStatus('Não conectado');alertMsg('Abra este add-in dentro do MyGeotab para carregar dados reais.',false,true);setRefreshLoading(false);return}apiRef=api;setStatus('Carregando...');alertMsg('Carregando base ativa de 7 dias, offline 30d apenas para quem está sem comunicação e diagnósticos de desconexão...');const now=new Date(),from7=new Date(now.getTime()-7*DAY),from30=new Date(now.getTime()-30*DAY);try{const groups=await call(api,'Group',{}).catch(()=>[]);const groupById={};groups.forEach(g=>{if(g&&g.id)groupById[g.id]=g});const collectDesc=id=>{const out=[],stack=[id],seen={};while(stack.length){const cur=stack.pop();if(seen[cur])continue;seen[cur]=true;out.push(cur);const node=groupById[cur];const kids=(node&&node.children)||[];kids.forEach(c=>{const cid=typeof c==='string'?c:c&&c.id;if(cid)stack.push(cid)})}return out};groupDesc={};Object.keys(groupById).forEach(id=>groupDesc[id]=collectDesc(id));$('groupFilter').innerHTML='<option value="">Todos os grupos</option>'+groups.filter(g=>g.name&&g.name!=='GroupCompanyId'&&g.name!=='GroupNothingId').sort((a,b)=>a.name.localeCompare(b.name)).map(g=>`<option value="${g.id}">${g.name}</option>`).join('');restoreFilters();const devs=await call(api,'Device',{fromDate:now.toISOString()}).catch(()=>call(api,'Device',{}));const dm={};devs.forEach(d=>{if(!d.name)return;const activeTo=d.activeTo?new Date(d.activeTo):null,activeFrom=d.activeFrom?new Date(d.activeFrom):null;if(activeTo&&activeTo<now)return;if(activeFrom&&activeFrom>now)return;if(d.isArchived===true)return;dm[d.id]={nome:d.name,placa:d.licensePlate||d.name,grupos:(d.groups||[]).map(g=>g.id)}});const dsi=await call(api,'DeviceStatusInfo',{});const latest={};dsi.forEach(s=>{const id=s.device&&s.device.id;if(!id||!dm[id]||!s.dateTime)return;const t=new Date(s.dateTime);if(isNaN(t)||t<from30)return;if(!latest[id]||t>new Date(latest[id].dateTime))latest[id]=s});const active={};Object.keys(latest).forEach(id=>{if(new Date(latest[id].dateTime)>=from7)active[id]=latest[id]});let st=[];try{st=await call(api,'StatusData',{fromDate:from7.toISOString(),toDate:now.toISOString()})}catch(e){st=[]}let faults=[];try{faults=await call(api,'FaultData',{fromDate:from7.toISOString(),toDate:now.toISOString()})}catch(e){faults=[]}const staleIds=Object.keys(dm).filter(id=>!active[id]);let faultsPrev=[];if(staleIds.length){try{faultsPrev=await call(api,'FaultData',{fromDate:from30.toISOString(),toDate:from7.toISOString(),deviceSearch:{deviceIds:staleIds}})}catch(e){faultsPrev=[]}}const by={};st.concat(faults).concat(faultsPrev).forEach(r=>{const id=r.device&&r.device.id;if(id)(by[id]||(by[id]=[])).push(r)});const STALE=Object.keys(dm).filter(id=>!active[id]);vehicles=Object.keys(active).concat(STALE).map(id=>{const s=latest[id]||null,i=dm[id],base={id,nome:i.nome,placa:i.placa,grupos:i.grupos,lat:s&&s.latitude!=null?Number(s.latitude):null,lng:s&&s.longitude!=null?Number(s.longitude):null,lastDate:s?s.dateTime:null,online:s?!!s.isDeviceCommunicating:false};return Object.assign(base,analyze(by[id]||[],base))}).sort((a,b)=>a.score-b.score);filtered=[...vehicles];restoreFilters();apply();setStatus(vehicles.length+' veículos analisados ('+STALE.length+' offline)');alertMsg('Análise concluída. Offline (sem comunicação): '+vehicles.filter(v=>v.offline).length+' | Offline 30d+: '+vehicles.filter(v=>v.offline30).length+' | Possível remoção: '+vehicles.filter(v=>v.unplugged>0).length+'.',true);render()}catch(e){console.error(e);setStatus('Erro');alertMsg('Erro ao carregar: '+(e.message||'Erro desconhecido'),false,true)}finally{setRefreshLoading(false)}}
function apply(){saveFilters();const g=$('groupFilter').value,s=$('scoreFilter').value,txt=$('queryFilter').value.toLowerCase().trim();filtered=vehicles.filter(v=>{if(!groupMatch(v,g))return false;if(txt&&!((v.nome+' '+v.placa).toLowerCase().includes(txt)))return false;if(s==='healthy'&&v.score<80)return false;if(s==='attention'&&(v.score<60||v.score>=80))return false;if(s==='critical'&&v.score>=60)return false;if(s==='nodata'&&v.dias<7)return false;if(s==='offline'&&!v.offline)return false;if(s==='offline30'&&!v.offline30)return false;if(problemFilter&&!match(v,problemFilter))return false;return true});const parts=[];if(g)parts.push('grupo');if(s)parts.push('status');if(txt)parts.push('busca');if(problemFilter)parts.push(pName(problemFilter));$('filterInfo').innerHTML=parts.length?`<span class="filterpill">Filtro: ${parts.join(' + ')} • ${filtered.length} veículos <span class="clear" onclick="window._clearProblem()">limpar problema</span></span>`:'';render()}
function clearFilters(){problemFilter='';$('groupFilter').value='';$('scoreFilter').value='';$('queryFilter').value='';apply()}
function setRefreshLoading(on){const b=$('refreshBtn');if(!b)return;if(on){b.disabled=true;b.classList.add('loading');b.dataset.old=b.textContent;b.innerHTML='<span class="spinner"></span>Atualizando...'}else{b.disabled=false;b.classList.remove('loading');b.textContent=b.dataset.old||'Atualizar análise'}}
window._clearProblem=function(){problemFilter='';apply()};window._problem=function(k){problemFilter=problemFilter===k?'':k;apply()};
function render(){const c=$('countBox');if(c)c.textContent=filtered.length.toLocaleString('pt-BR');const infoEl=$('filterInfo');if(infoEl&&!infoEl.innerHTML.includes('filterpill'))infoEl.innerHTML='Offline (sem comunicação): <b style="color:var(--red)">'+vehicles.filter(v=>v.offline).length+'</b> | Offline 30d+: <b style="color:var(--red)">'+vehicles.filter(v=>v.offline30).length+'</b>';renderKpis();renderDist();renderProblems();renderElectric();renderTable();if(!map)initMap();plot();if(filtered[0])showDetail(filtered[0])}
function mini(values,color){const max=Math.max(1,...values);return '<div class="mini">'+values.map(v=>`<i style="height:${Math.max(4,Math.round(v/max*26))}px;background:${color}"></i>`).join('')+'</div>'}
function renderKpis(){const total=filtered.length||1,avg=Math.round(filtered.reduce((s,v)=>s+v.score,0)/total),h=filtered.filter(v=>v.score>=80).length,a=filtered.filter(v=>v.score>=60&&v.score<80).length,c=filtered.filter(v=>v.score<60).length,n=filtered.filter(v=>v.dias>=7).length,u=filtered.filter(v=>v.unplugged>0).length,off=filtered.filter(v=>v.offline).length,off30=filtered.filter(v=>v.offline30).length;const cards=[['Fleet Health Index',avg,'de 100','var(--blue)',[avg,Math.max(0,avg-5),avg+2,Math.max(0,avg-9),avg]],['Saudáveis',h,pct(h,total)+'% da frota','var(--green)',[h,Math.max(0,h-1),h+1,h,h+2]],['Críticos',c,pct(c,total)+'% da frota','var(--red)',[c,Math.max(0,c-1),c,c+1,c]],['Sem dados 7d',n,pct(n,total)+'% da frota','var(--red)',[n,Math.max(0,n-2),n-1,n,n]],['Offline (sem comunicação)',off,pct(off,total)+'% da frota','var(--red)',[off,Math.max(0,off-2),off-1,off,off+1]],['Offline 30d+ (total)',off30,pct(off30,total)+'% da frota','var(--red)',[off30,Math.max(0,off30-1),off30,off30,off30]],['Possível remoção',u,pct(u,total)+'% da frota','var(--red)',[u,Math.max(0,u-1),u,u+1,u]]];$('kpisBox').innerHTML=cards.map(r=>`<div class="kpi"><span>${r[0]}</span><b style="color:${r[3]}">${r[1]}</b><small>${r[2]}</small>${mini(r[4],r[3])}</div>`).join('')}
function bars(rows){const m=Math.max(1,...rows.map(r=>r[1]));return rows.map(r=>`<div class="barrow"><b style="color:var(--txt)">${r[0]}</b><div class="track"><div class="fill" style="width:${Math.round(r[1]/m*100)}%;background:${r[3]||'var(--blue)'}"></div></div><span style="font-family:var(--mono);color:var(--txt)">${r[1]}${r[2]?' ('+r[2]+')':''}</span></div>`).join('')}
function renderDist(){const total=filtered.length||1;const rows=[['80 - 100',filtered.filter(v=>v.score>=80).length,pct(filtered.filter(v=>v.score>=80).length,total)+'%','var(--blue)'],['60 - 79',filtered.filter(v=>v.score>=60&&v.score<80).length,pct(filtered.filter(v=>v.score>=60&&v.score<80).length,total)+'%','var(--blue)'],['40 - 59',filtered.filter(v=>v.score>=40&&v.score<60).length,pct(filtered.filter(v=>v.score>=40&&v.score<60).length,total)+'%','var(--orange)'],['0 - 39',filtered.filter(v=>v.score<40).length,pct(filtered.filter(v=>v.score<40).length,total)+'%','var(--red)']];$('distBox').innerHTML=bars(rows)}
function renderProblems(){const base=filtered;const rows=[['unplugged','Possível remoção não autorizada',base.filter(v=>match(v,'unplugged')).length,'var(--red)'],['voltage','Tensão fora do padrão',base.filter(v=>match(v,'voltage')).length,'var(--red)'],['nodata','Sem dados 7 dias',base.filter(v=>match(v,'nodata')).length,'var(--red)'],['offline','Sem comunicação (offline)',base.filter(v=>match(v,'offline')).length,'var(--red)'],['offline30','Offline 30d+ (total)',base.filter(v=>match(v,'offline30')).length,'var(--red)'],['vlow','Tensão baixa',base.filter(v=>match(v,'vlow')).length,'var(--orange)'],['vhigh','Tensão alta',base.filter(v=>match(v,'vhigh')).length,'var(--orange)'],['reboot','Reboot excessivo',base.filter(v=>match(v,'reboot')).length,'var(--gray)'],['gps','Falha GPS',base.filter(v=>match(v,'gps')).length,'var(--gray)'],['device','Falha crítica device',base.filter(v=>match(v,'device')).length,'var(--red)']];const m=Math.max(1,...rows.map(r=>r[2]));$('problemsBox').innerHTML='<table><tbody>'+rows.map(r=>`<tr class="problem ${problemFilter===r[0]?'active':''}" onclick="window._problem('${r[0]}')"><td style="width:210px;color:var(--txt);font-weight:800">${r[1]}</td><td><div class="track"><div class="fill" style="width:${Math.round(r[2]/m*100)}%;background:${problemFilter===r[0]?'var(--orange)':r[3]}"></div></div></td><td style="width:42px;font-family:var(--mono);color:var(--txt)">${r[2]}</td></tr>`).join('')+'</tbody></table>'}
function renderElectric(){const total=filtered.reduce((s,v)=>s+(v.voltageTotal||0),0),bad=filtered.reduce((s,v)=>s+v.vlow+v.vhigh,0),good=Math.max(0,total-bad),quality=pct(good,total),deg=Math.round(quality*3.6);$('electricBox').innerHTML=`<div class="donutwrap"><div class="donut" style="background:conic-gradient(var(--green) 0deg,var(--green) ${deg}deg,var(--red) ${deg}deg,var(--red) 360deg)"><div><b>${quality}%</b><br><small>Qualidade</small></div></div><div class="legend"><div><i style="background:var(--green)"></i>Leituras válidas: <b>${good}</b> (${quality}%)</div><div><i style="background:var(--red)"></i>Fora do padrão: <b>${bad}</b> (${pct(bad,total)}%)</div><div>Total de leituras: <b>${total}</b></div></div></div>`}

window._sel=function(id){const v=vehicles.find(x=>x.id===id);if(v)showDetail(v)};
function showDetail(v){const voltage=v.badVoltages&&v.badVoltages.length?`<div><label>Leituras ruins</label><span>${v.badVoltages.map(fmt).join(', ')} V</span></div>`:'';const reasons=v.reasons.length?v.reasons:['Nenhum problema técnico relevante nos últimos 7 dias.'];$('detailBox').innerHTML=`<div class="detail"><div><label>Veículo</label><span>${v.nome}</span></div><div><label>Placa</label><span>${v.placa||'—'}</span></div><div><label>Score</label><span style="color:${scColor(v.score)}">${v.score}/100</span></div><div><label>Status</label><span>${scLabel(v.score)}</span></div><div><label>Último dado</label><span>${v.offline30?'30d+ (offline total)':v.dias>=7?'7d+ (offline)':v.dias+'d'}</span></div><div><label>Online / Comunicação</label><span style="color:${v.online?'var(--green)':'var(--red)'}">${v.online?'Sim':'Não — sem comunicação'}</span></div><div><label>Tensão min/max</label><span>${v.minV==null?'N/I':fmt(v.minV)+' / '+fmt(v.maxV)}</span></div><div><label>Desconexão/rem. possível</label><span>${v.unplugged>0?'Sim':'Não'}</span></div>${voltage}</div><div class="diaglist" style="margin-top:12px"><div><span>Tensão mínima</span><b>${fmt(v.minV)}</b></div><div><span>Tensão máxima</span><b>${fmt(v.maxV)}</b></div><div><span>Leituras fora do padrão</span><b>${v.vlow+v.vhigh}</b></div><div><span>Reboots 7 dias</span><b>${v.reboots}</b></div><div><span>Falhas GPS</span><b>${v.gps}</b></div><div><span>Falhas críticas</span><b>${v.faults}</b></div><div><span>Diagnostic unplugged</span><b>${v.unplugged}</b></div></div><div class="reason">${reasons.map(r=>`<div class="${r.includes('remoção')?'hot':''}">${r}</div>`).join('')}</div>`;if(map&&v.lat&&v.lng)map.setView([v.lat,v.lng],12)}

function plot(){if(!layer)return;layer.clearLayers();filtered.forEach(v=>{if(v.lat==null||v.lng==null||isNaN(v.lat)||isNaN(v.lng))return;const col=v.unplugged>0?'#ef4444':v.score>=80?'#10b981':v.score>=60?'#f59e0b':v.score>=40?'#f97316':'#ef4444';const m=L.circleMarker([v.lat,v.lng],{radius:v.unplugged>0?10:8,fillColor:col,color:'#fff',weight:1.5,fillOpacity:.88});m.bindPopup(`<b>${v.nome}</b><br>${v.placa||''}<br>Score ${v.score}<br>${mainProblem(v)}`);m.on('click',()=>showDetail(v));layer.addLayer(m)});const withPos=filtered.filter(v=>v.lat!=null&&v.lng!=null&&!isNaN(v.lat)&&!isNaN(v.lng));if(withPos.length){map.setView([withPos.reduce((s,v)=>s+v.lat,0)/withPos.length,withPos.reduce((s,v)=>s+v.lng,0)/withPos.length],5)}}
function exportCSV(){const rows=[['nome','placa','score','status','problema_principal','sem_comunicacao_offline','offline_30d_total','possivel_remocao_nao_autorizada','diagnostic_unplugged_count','datas_possivel_remocao','dias_sem_dados','reboots','falhas_gps','tensao_fora','leituras_tensao_ruins','tensao_min','tensao_max','falhas_device']].concat(filtered.map(v=>[v.nome,v.placa,v.score,scLabel(v.score),mainProblem(v),v.offline?'sim':'nao',v.offline30?'sim':'nao',v.unplugged>0?'sim':'nao',v.unplugged,v.removalDatesText||'-',v.dias,v.reboots,v.gps,v.vlow+v.vhigh,(v.badVoltages||[]).map(fmt).join('|'),fmt(v.minV),fmt(v.maxV),v.faults]));const csv=rows.map(r=>r.map(x=>'"'+String(x??'').replace(/"/g,'""')+'"').join(';')).join('\n');const blob=new Blob([csv],{type:'text/csv;charset=utf-8'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='fleet-health-score.csv';a.click();URL.revokeObjectURL(a.href)}
